<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Max — Klar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/klar.css">
  <style>
    body { overflow: hidden; }

    .chat-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Top bar ── */
    .chat-topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .chat-topbar-back {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      transition: color var(--t);
      text-decoration: none;
    }
    .chat-topbar-back:hover { color: var(--text); }
    .chat-topbar-back svg { width: 18px; height: 18px; }

    .chat-topbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
    }

    .chat-topbar-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }
    .chat-topbar-info { flex: 1; }
    .chat-topbar-name { font-weight: 700; font-size: 15px; color: var(--text); line-height: 1.2; }
    .chat-topbar-sub { font-size: 12px; color: var(--green); font-weight: 500; }

    .chat-topbar-clear {
      font-size: 13px;
      color: var(--text-muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 6px 12px;
      cursor: pointer;
      transition: all var(--t);
      font-family: var(--font);
    }
    .chat-topbar-clear:hover { background: var(--surface-2); color: var(--text); }

    /* ── Messages ── */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      scroll-behavior: smooth;
    }
    #chat-messages::-webkit-scrollbar { width: 6px; }
    #chat-messages::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }

    .msg-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .msg-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-row.user .msg-avatar {
      background: var(--surface-3);
      color: var(--text);
    }

    .msg-content { max-width: calc(100% - 60px); }
    .msg-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: .02em;
    }
    .msg-row.user .msg-name { text-align: right; }

    .msg-bubble {
      display: inline-block;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
      background: var(--surface-2);
      border-bottom-left-radius: 4px;
    }
    .msg-row.user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble p { margin: 0 0 10px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble strong { font-weight: 700; }
    .msg-bubble em { font-style: italic; }
    .msg-bubble code {
      background: rgba(0,0,0,.07);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .msg-row.user .msg-bubble code { background: rgba(255,255,255,.22); }
    .msg-bubble pre {
      background: rgba(0,0,0,.06);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg-bubble pre code { background: none; padding: 0; font-size: 13px; }

    .msg-typing {
      display: flex;
      gap: 6px;
      padding: 14px 18px;
      background: var(--surface-2);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      align-items: center;
    }
    .msg-typing span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-subtle);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .msg-typing span:nth-child(2) { animation-delay: .2s; }
    .msg-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: .6; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* ── Input bar ── */
    .chat-inputbar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 24px 20px;
      flex-shrink: 0;
    }
    .chat-inputbar-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 15px;
      font-family: var(--font);
      color: var(--text);
      background: var(--surface-2);
      resize: none;
      outline: none;
      max-height: 160px;
      overflow-y: auto;
      line-height: 1.55;
      transition: border-color var(--t), background var(--t);
    }
    #chat-input:focus { border-color: var(--accent); background: var(--surface); }
    #chat-input::placeholder { color: var(--text-subtle); }

    #chat-send {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background var(--t), transform 120ms;
    }
    #chat-send:hover { background: var(--accent-h); }
    #chat-send:active { transform: scale(0.93); }
    #chat-send:disabled { background: var(--border-strong); cursor: not-allowed; transform: none; }
    #chat-send svg { width: 20px; height: 20px; }

    .chat-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-subtle);
      margin-top: 10px;
    }

    /* ── Empty state ── */
    .chat-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      padding: 40px 24px;
      text-align: center;
    }
    .chat-empty-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 28px;
      margin-bottom: 8px;
    }
    .chat-empty h2 { font-size: 22px; font-weight: 700; }
    .chat-empty p { color: var(--text-muted); font-size: 15px; max-width: 360px; }

    .chat-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }
    .chat-suggestion {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: all var(--t);
      font-family: var(--font);
    }
    .chat-suggestion:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-lt);
    }

    @media (max-width: 600px) {
      .chat-topbar { padding: 0 16px; }
      .chat-inputbar { padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>
<div class="chat-layout">

  <!-- Top bar -->
  <div class="chat-topbar">
    <a href="/dashboard.html" class="chat-topbar-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back
    </a>
    <div class="chat-topbar-divider"></div>
    <div class="chat-topbar-avatar">M</div>
    <div class="chat-topbar-info">
      <div class="chat-topbar-name">Max</div>
      <div class="chat-topbar-sub">Online — ask me anything</div>
    </div>
    <button class="chat-topbar-clear" id="clear-btn">Clear chat</button>
  </div>

  <!-- Messages -->
  <div id="chat-messages">
    <div class="msg-wrap" id="msg-wrap">
      <!-- Empty state shown until first message -->
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-avatar">M</div>
        <h2>Hallo! Ich bin Max.</h2>
        <p>Dein Begleiter bei Klar. Grammatik, Vokabeln, Kultur, oder einfach quatschen — ich bin für alles da.</p>
        <div class="chat-suggestions">
          <button class="chat-suggestion" data-q="Explain Konjunktiv II in simple terms">Konjunktiv II erklärt</button>
          <button class="chat-suggestion" data-q="Why is German grammar so complex?">Warum ist Deutsch so komplex?</button>
          <button class="chat-suggestion" data-q="Give me 10 examples of Dativ vs Akkusativ">Dativ vs. Akkusativ</button>
          <button class="chat-suggestion" data-q="What does 'Mitteilungsbedürfnis' mean?">Was heißt Mitteilungsbedürfnis?</button>
          <button class="chat-suggestion" data-q="I lost my hope with German. Help.">Ich verliere die Hoffnung...</button>
          <button class="chat-suggestion" data-q="Tell me something interesting about German culture">Deutsche Kultur</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Input bar -->
  <div class="chat-inputbar">
    <div class="chat-inputbar-inner">
      <textarea
        id="chat-input"
        placeholder="Frag mich irgendwas — auf Deutsch, auf Englisch, auf Pashto..."
        rows="1"
      ></textarea>
      <button id="chat-send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <p class="chat-hint">Enter to send · Shift+Enter for new line</p>
  </div>

</div>

<script src="/js/klar.js"></script>
<script>
  // ── State ──────────────────────────────────────────────────
  const messages = [];
  let isStreaming = false;

  const msgWrap   = document.getElementById('msg-wrap');
  const emptyEl   = document.getElementById('chat-empty');
  const input     = document.getElementById('chat-input');
  const sendBtn   = document.getElementById('chat-send');
  const clearBtn  = document.getElementById('clear-btn');

  // ── Suggestion chips ───────────────────────────────────────
  document.querySelectorAll('.chat-suggestion').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.q;
      send();
    });
  });

  // ── Clear ──────────────────────────────────────────────────
  clearBtn.addEventListener('click', () => {
    messages.length = 0;
    // Remove all messages but keep empty state
    Array.from(msgWrap.querySelectorAll('.msg-row')).forEach(el => el.remove());
    emptyEl.style.display = '';
  });

  // ── Render helpers ─────────────────────────────────────────
  function renderMarkdown(text) {
    let html = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');

    // Convert newlines to paragraphs (but not inside pre blocks)
    const parts = html.split(/(<pre>[\s\S]*?<\/pre>)/g);
    return parts.map((part, i) => {
      if (i % 2 === 1) return part; // pre block — keep as-is
      return part.split(/\n\n+/).map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');
    }).join('');
  }

  function createMsgRow(role, text) {
    const isUser = role === 'user';
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = isUser ? 'Du' : 'M';

    const content = document.createElement('div');
    content.className = 'msg-content';

    const name = document.createElement('div');
    name.className = 'msg-name';
    name.textContent = isUser ? 'Du' : 'Max';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = renderMarkdown(text);

    content.appendChild(name);
    content.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(content);
    return { row, bubble };
  }

  function addMessage(role, text) {
    messages.push({ role, content: text });
    emptyEl.style.display = 'none';
    const { row } = createMsgRow(role, text);
    msgWrap.appendChild(row);
    scrollToBottom();
  }

  function scrollToBottom() {
    const el = document.getElementById('chat-messages');
    el.scrollTop = el.scrollHeight;
  }

  // ── Send ───────────────────────────────────────────────────
  async function send() {
    const text = input.value.trim();
    if (!text || isStreaming) return;

    input.value = '';
    autoResize();
    addMessage('user', text);

    isStreaming = true;
    sendBtn.disabled = true;

    // Typing indicator
    emptyEl.style.display = 'none';
    const typingRow = document.createElement('div');
    typingRow.className = 'msg-row assistant';
    typingRow.id = 'typing-indicator';
    typingRow.innerHTML = `
      <div class="msg-avatar">M</div>
      <div class="msg-content">
        <div class="msg-name">Max</div>
        <div class="msg-typing"><span></span><span></span><span></span></div>
      </div>`;
    msgWrap.appendChild(typingRow);
    scrollToBottom();

    const apiMessages = messages.slice(-30).map(m => ({ role: m.role, content: m.content }));

    try {
      const res = await fetch('/api/companion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: apiMessages })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let replyText = '';

      // Remove typing indicator and create streaming bubble
      document.getElementById('typing-indicator')?.remove();

      const streamRow = document.createElement('div');
      streamRow.className = 'msg-row assistant';
      const streamAvatar = document.createElement('div');
      streamAvatar.className = 'msg-avatar';
      streamAvatar.textContent = 'M';
      const streamContent = document.createElement('div');
      streamContent.className = 'msg-content';
      const streamName = document.createElement('div');
      streamName.className = 'msg-name';
      streamName.textContent = 'Max';
      const streamBubble = document.createElement('div');
      streamBubble.className = 'msg-bubble';
      streamBubble.innerHTML = '<span style="opacity:.4">▊</span>';
      streamContent.appendChild(streamName);
      streamContent.appendChild(streamBubble);
      streamRow.appendChild(streamAvatar);
      streamRow.appendChild(streamContent);
      msgWrap.appendChild(streamRow);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') break;
          try {
            const { text: chunk, error } = JSON.parse(payload);
            if (error) throw new Error(error);
            if (chunk) {
              replyText += chunk;
              streamBubble.innerHTML = renderMarkdown(replyText) + '<span style="opacity:.4">▊</span>';
              scrollToBottom();
            }
          } catch (e) { /* skip */ }
        }
      }

      streamBubble.innerHTML = renderMarkdown(replyText);
      messages.push({ role: 'assistant', content: replyText });
      scrollToBottom();

    } catch (err) {
      document.getElementById('typing-indicator')?.remove();
      addMessage('assistant', 'Sorry, da ist was schiefgelaufen. Versuch es nochmal!');
      console.error('[Max chat]', err);
    }

    isStreaming = false;
    sendBtn.disabled = false;
    input.focus();
  }

  // ── Input auto-resize ──────────────────────────────────────
  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  // Focus input on load
  input.focus();
</script>
</body>
</html>
